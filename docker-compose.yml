version: '3.8'

services:
  # Metadata Database (PostgreSQL) - strictly for app metadata, lineage, and jobs
  postgres:
    image: postgres:16-alpine
    container_name: analyzax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyzax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyzax_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-analyzax_metadata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyzax} -d ${POSTGRES_DB:-analyzax_metadata}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Background Queue Broker (Redis) - for asynchronous analytical tasks
  redis:
    image: redis:7-alpine
    container_name: analyzax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend Service (FastAPI) - analytical services and engine orchestration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analyzax-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Service (Next.js / Tailwind CSS / shadcn/ui)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analyzax-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
