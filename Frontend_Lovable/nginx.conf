# Static SPA server for the production frontend image (Dockerfile.prod).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Fingerprinted build assets can be cached long-term
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes fall back to index.html (same as vercel.json rewrites)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
