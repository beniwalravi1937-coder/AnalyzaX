# ==============================================================================
# AnalyzaX Production Nginx Site Configuration
# Routes /api and /health to FastAPI backend (port 8000)
# Routes UI traffic to Next.js frontend (port 3000)
# ==============================================================================

upstream backend_upstream {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Client body limit for dataset file uploads (500MB)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Timeouts for heavy analytical queries
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Security Headers from Nginx edge
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API & Backend Endpoints
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    # 2. WebSocket Support (Interactive AI analyst & live notifications)
    location /api/v1/ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 3. Health & Liveness Probes
    location ~ ^/(health|health/live|health/ready) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Prometheus Metrics Scrape Endpoint
    location = /metrics {
        proxy_pass http://backend_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 5. Frontend Next.js Static & Dynamic Routes
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
