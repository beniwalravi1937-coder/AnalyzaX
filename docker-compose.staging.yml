# ==============================================================================
# AnalyzaX — Staging Docker Compose Topology
# ==============================================================================

version: '3.8'

services:
  proxy:
    image: nginx:1.25-alpine
    container_name: analyzax-staging-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - analyzax-staging-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analyzax-staging-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - analyzax-staging-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: analyzax-staging-backend
    restart: always
    env_file:
      - .env.staging.example
    volumes:
      - staging_analyzax_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analyzax-staging-net

  postgres:
    image: postgres:16-alpine
    container_name: analyzax-staging-postgres
    restart: always
    environment:
      POSTGRES_USER: analyzax_staging
      POSTGRES_PASSWORD: staging_secure_password_analyzax_2026
      POSTGRES_DB: analyzax_staging
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzax_staging -d analyzax_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analyzax-staging-net

networks:
  analyzax-staging-net:
    driver: bridge

volumes:
  staging_postgres_data:
  staging_analyzax_data:
